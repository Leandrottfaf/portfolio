<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIM to CAD — pointSpace</title>
  <meta name="description" content="Scroll-driven presentation: a Revit model builds from the basement up, turns to an orthographic front view and becomes the CAD elevation." />
  <style>
    @font-face { font-family: "Neue Haas"; src: url("../fonts/NeueHaasDisplayRoman.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "Neue Haas"; src: url("../fonts/NeueHaasDisplayMediu.ttf") format("truetype"); font-weight: 500; }
    @font-face { font-family: "Neue Haas"; src: url("../fonts/NeueHaasDisplayBold.ttf") format("truetype"); font-weight: 700; }

    :root {
      --green: #004227; --green-glass: rgba(0, 66, 39, 0.92);
      --gold: #deb047; --gold-border: rgba(222, 176, 71, 0.25);
      --cream: #f5f0e6; --cream-soft: rgba(245, 240, 230, 0.7);
      --gutter: 40px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--green); color: var(--cream); font-family: "Neue Haas", system-ui, sans-serif; line-height: 1.65; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }

    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
    .brand { font-weight: 700; letter-spacing: 0.3px; color: var(--cream); text-decoration: none; }
    .brand span { color: var(--gold); }
    .lang { display: flex; background: rgba(0, 83, 49, 0.5); border-radius: 20px; padding: 3px; border: 1px solid rgba(245, 240, 230, 0.08); }
    .lang button { padding: 5px 14px; border-radius: 17px; border: 0; cursor: pointer; font: 700 11px/1 inherit; letter-spacing: 0.5px; background: transparent; color: var(--cream-soft); }
    .lang button[aria-pressed="true"] { background: var(--gold); color: var(--green); }

    .intro { padding: 72px 0 40px; }
    .tag { text-transform: uppercase; font-size: 11px; letter-spacing: 4px; color: var(--gold); font-weight: 600; margin-bottom: 10px; }
    h1 { font-size: 48px; line-height: 1.1; font-weight: 700; max-width: 720px; margin-bottom: 18px; }
    h1 em { font-style: normal; color: var(--gold); }
    .intro p { color: var(--cream-soft); font-size: 16px; max-width: 600px; }

    .track { height: 380vh; position: relative; }
    .sticky { position: sticky; top: 0; height: 100vh; height: 100svh; padding: 16px 0; }
    .stage { position: relative; height: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold-border); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); background: #ebe6da; }
    #viewer { position: absolute; inset: 0; }

    .caption { position: absolute; top: 20px; left: 20px; max-width: 340px; padding: 16px 20px; border-radius: 10px; background: var(--green-glass); border: 1px solid var(--gold-border); pointer-events: none; }
    .caption.enter { animation: capIn 0.45s cubic-bezier(.22, 1, .36, 1) both; }
    @keyframes capIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .caption .k { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
    .caption .t { font-size: 19px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
    .caption .d { font-size: 13px; color: var(--cream-soft); line-height: 1.55; }

    .hint { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); padding: 8px 16px; border-radius: 30px; background: var(--gold); color: var(--green); font-size: 12px; font-weight: 700; white-space: nowrap; transition: opacity 0.4s ease; pointer-events: none; }
    .hint.hidden { opacity: 0; }

    .steps { position: absolute; left: 20px; right: 20px; bottom: 18px; pointer-events: none; --ink: 0, 66, 39; }
    .steps.dark { --ink: 245, 240, 230; }
    .steps .labels { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .steps .labels span { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; color: rgba(var(--ink), 0.45); transition: color 0.3s ease; }
    .steps .labels span.on { color: rgb(var(--ink)); }
    .steps.dark .labels span.on { color: var(--gold); }
    .steps .bar { height: 3px; border-radius: 2px; background: rgba(var(--ink), 0.15); overflow: hidden; }
    .steps .bar div { height: 100%; background: var(--gold); transform-origin: left; transform: scaleX(0); }

    .outro { padding: 72px 0 96px; text-align: center; }
    .outro h2 { font-size: 34px; font-weight: 700; margin-bottom: 10px; }
    .outro p { color: var(--cream-soft); max-width: 520px; margin: 0 auto 28px; }
    .btn { display: inline-block; padding: 13px 32px; background: var(--gold); color: var(--green); border-radius: 6px; font-weight: 700; font-size: 14px; text-decoration: none; }

    @media (max-width: 640px) {
      :root { --gutter: 16px; }
      .intro { padding: 40px 0 28px; }
      h1 { font-size: 30px; }
      .intro p { font-size: 14px; }
      .track { height: 300vh; }
      .sticky { padding: 10px 0; }
      .caption { top: 12px; left: 12px; right: 12px; max-width: none; padding: 12px 14px; }
      .caption .t { font-size: 16px; }
      .caption .d { font-size: 12px; }
      .hint { bottom: 64px; }
      .steps { left: 12px; right: 12px; bottom: 12px; }
      .steps .labels span { font-size: 9px; }
      .outro h2 { font-size: 26px; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://www.pointspace.ca">point<span>Space</span></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <section class="intro">
      <p class="tag" data-i18n="tag"></p>
      <h1 data-i18n-html="title"></h1>
      <p data-i18n="desc"></p>
    </section>

    <section class="track" id="track">
      <div class="sticky">
        <div class="stage">
          <div id="viewer"></div>
          <div class="caption" id="caption" aria-live="polite">
            <div class="k"></div>
            <div class="t"></div>
            <div class="d"></div>
          </div>
          <div class="hint" id="hint" data-i18n="hint"></div>
          <div class="steps" id="steps">
            <div class="labels"></div>
            <div class="bar"><div id="bar"></div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="outro">
      <h2 data-i18n="outroTitle"></h2>
      <p data-i18n="outroDesc"></p>
      <a class="btn" href="https://www.pointspace.ca" data-i18n="cta"></a>
    </section>
  </div>

  <script type="module">
    import { mount } from "./model-to-cad.js";

    const TEXT = {
      en: {
        tag: "From model to drawing",
        title: "From BIM model to <em>CAD drawing</em>.",
        desc: "Scroll: the model builds up level by level, turns into an orthographic view, then becomes the delivered elevation.",
        hint: "Scroll to build ↓",
        steps: [
          { k: "BIM model", t: "Built from basement to ridge", d: "The Revit model rises level by level, cut by a moving section box." },
          { k: "Orthographic view", t: "Aligned with the facade", d: "The camera turns to a perfectly straight-on orthographic view." },
          { k: "Drafting", t: "The deliverable elevation", d: "The model becomes hidden-line CAD linework, complete with levels." },
        ],
        outroTitle: "One model, every deliverable.",
        outroDesc: "BIM models, elevations, plans and sections, all coordinated from the same source.",
        cta: "Discuss your project",
      },
      fr: {
        tag: "Du modèle au plan",
        title: "Du modèle BIM au <em>dessin CAD</em>.",
        desc: "Faites défiler : la maquette se construit niveau par niveau, pivote en vue orthogonale, puis devient l'élévation livrée.",
        hint: "Défilez pour construire ↓",
        steps: [
          { k: "Modèle BIM", t: "Construit du sous-sol au faîte", d: "La maquette Revit s'élève niveau par niveau, coupée par une boîte de section." },
          { k: "Vue orthogonale", t: "Alignée sur la façade", d: "La caméra pivote jusqu'à une vue orthogonale parfaitement frontale." },
          { k: "Mise en plan", t: "L'élévation livrable", d: "Le modèle devient un dessin CAD en lignes cachées, avec ses niveaux." },
        ],
        outroTitle: "Un modèle, tous les livrables.",
        outroDesc: "Modèles BIM, élévations, plans et coupes, coordonnés à partir de la même source.",
        cta: "Discuter de votre projet",
      },
    };

    const track = document.getElementById("track");
    const caption = document.getElementById("caption");
    const steps = document.getElementById("steps");
    const bar = document.getElementById("bar");
    const hint = document.getElementById("hint");
    const mobile = matchMedia("(max-width: 640px)");

    let lang = navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en";
    let step = -1;

    function setLang(l) {
      lang = l;
      const t = TEXT[l];
      document.documentElement.lang = l;
      document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t[el.dataset.i18n]));
      document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t[el.dataset.i18nHtml]));
      document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === l));
      steps.querySelector(".labels").innerHTML = t.steps.map((s) => `<span>${s.k}</span>`).join("");
      showStep(Math.max(step, 0), true);
    }

    function showStep(i, force) {
      if (i === step && !force) return;
      const changed = i !== step;
      step = i;
      const s = TEXT[lang].steps[i];
      caption.querySelector(".k").textContent = `0${i + 1} / 03 — ${s.k}`;
      caption.querySelector(".t").textContent = s.t;
      caption.querySelector(".d").textContent = s.d;
      if (changed) { caption.classList.remove("enter"); void caption.offsetWidth; caption.classList.add("enter"); }
      steps.querySelectorAll(".labels span").forEach((el, j) => el.classList.toggle("on", j === i));
      steps.classList.toggle("dark", i === 2);
    }

    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

    const insets = () => (mobile.matches ? { top: 132, bottom: 64 } : { top: 24, bottom: 72 });
    const params = new URLSearchParams(location.search);
    const yaw = params.get("yaw");
    const viewer = mount(document.getElementById("viewer"), { insets: insets(), modelUrl: params.get("model"), yawDeg: yaw === null ? undefined : +yaw });
    mobile.addEventListener("change", () => viewer.setInsets(insets()));

    let raf = 0;
    function update() {
      raf = 0;
      const r = track.getBoundingClientRect();
      const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
      viewer.setProgress(p);
      bar.style.transform = `scaleX(${p})`;
      hint.classList.toggle("hidden", p > 0.02);
      showStep(p < 0.42 ? 0 : p < 0.66 ? 1 : 2);
    }
    const schedule = () => { if (!raf) raf = requestAnimationFrame(update); };
    addEventListener("scroll", schedule, { passive: true });
    addEventListener("resize", schedule);

    setLang(lang);
    update();
  </script>
</body>
</html>
