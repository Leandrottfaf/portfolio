# Publishes the site to GitHub Pages straight from the repo, without a Jekyll
# build, and without the files the pages never load (source models, raw PDFs,
# converter scripts), so each deploy uploads less.
#
# Takes over from the default "pages build and deployment" once
# Settings → Pages → Build and deployment → Source is set to "GitHub Actions".

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the published files
        run: |
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'images/raw/' \
            --exclude 'bim-to-cad/models/*.ifc' \
            --exclude 'bim-to-cad/tools/' \
            --exclude '*.md'
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
